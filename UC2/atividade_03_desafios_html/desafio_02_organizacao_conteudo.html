<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Organizando Conteúdos</title>
</head>
<body>
    <h1>Portal de Tecnologia</h1>
    <!-- DESAFIO 2: Complete com section, article, aside e div. -->
    <main>
        <!-- Seção de notícias -->
        <section>
            <h2>Notícias de Tecnologia</h2>
            <!-- Notícia independente -->
            <article>
                <h3>Novidades da Inteligência Artificial</h3>
                <p>A tecnologia está evoluindo.</p>
            </article>
        </section>

        <!-- Informações complementares -->
        <aside>
            <h3>Você sabia?</h3>
            <p>HTML significa HyperText Markup Language.</p>
        </aside>

        <!-- Agrupamento genérico -->
        <div>
            <p>Conteúdo em destaque!</p>
        </div>
    </main>
</body>
</html>
